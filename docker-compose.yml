services:
  absensi-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: absensi-lomba:latest
    container_name: absensi-app
    hostname: absensi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - absensi-net

networks:
  absensi-net:
    driver: bridge